<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — neRHee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }

        body {
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        /* Logo */
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .logo-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .logo-name span {
            color: #1e40af;
        }

        /* Card */
        .login-card {
            background: white;
            border: 1px solid #e8ecf0;
            border-radius: 16px;
            padding: 2rem 2rem 2.25rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        .login-card h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.3rem;
        }

        .login-card .subtitle {
            font-size: 0.82rem;
            color: #64748b;
            margin-bottom: 1.75rem;
        }

        /* Form fields */
        .field-group {
            margin-bottom: 1rem;
        }

        .field-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }

        .field-wrap {
            position: relative;
        }

        .field-wrap i {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.9rem;
            pointer-events: none;
        }

        .field-wrap input {
            width: 100%;
            padding: 0.52rem 0.85rem 0.52rem 2.2rem;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            font-size: 0.88rem;
            color: #1e293b;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            background: #fafafa;
        }

        .field-wrap input:focus {
            border-color: #1e40af;
            background: white;
            box-shadow: 0 0 0 3px rgba(30,64,175,0.08);
        }

        /* Toggle password */
        .toggle-pw {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 2px;
            transition: color 0.15s;
        }

        .toggle-pw:hover { color: #475569; }

        /* Submit */
        .btn-login {
            width: 100%;
            padding: 0.6rem;
            background: linear-gradient(135deg, #1e40af, #2563eb);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: opacity 0.18s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
        }

        .btn-login:hover { opacity: 0.92; }

        /* Error message */
        .login-error {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            border-radius: 8px;
            padding: 0.6rem 0.85rem;
            font-size: 0.8rem;
            color: #be123c;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="login-wrapper">

    <!-- Logo -->
    <div class="login-logo">
        <div class="logo-icon"><i class="bi bi-people-fill"></i></div>
        <span class="logo-name">ne<span>RH</span>ee</span>
    </div>

    <!-- Card -->
    <div class="login-card">
        <h1>Connexion</h1>
        <p class="subtitle">Accédez à votre espace de gestion RH</p>

        {% if messages %}
        {% for message in messages %}
        <div class="login-error">
            <i class="bi bi-exclamation-circle-fill"></i> {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="field-group">
                <label for="username">Nom d'utilisateur</label>
                <div class="field-wrap">
                    <i class="bi bi-person"></i>
                    <input type="text" id="username" name="username"
                           placeholder="Votre identifiant" required autocomplete="username">
                </div>
            </div>

            <div class="field-group">
                <label for="password">Mot de passe</label>
                <div class="field-wrap">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" required autocomplete="current-password">
                    <i class="bi bi-eye toggle-pw" id="togglePw"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Se connecter
            </button>
        </form>
    </div>

    <div class="login-footer">neRHee HRM System &copy; 2025</div>
</div>

<script>
document.getElementById('togglePw').addEventListener('click', function(){
    var inp = document.getElementById('password');
    if(inp.type === 'password'){
        inp.type = 'text';
        this.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        inp.type = 'password';
        this.classList.replace('bi-eye-slash', 'bi-eye');
    }
});
</script>
</body>
</html>
