{% extends 'base.html' %}

{% block title %}Demande d'Ordre de Mission{% endblock %}

{% block content %}
<h1>Demande d'Ordre de Mission</h1>

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>
    </div>
    <div class="form-group">
        <label for="start_date">Date de début:</label>
        <input type="date" id="start_date" name="start_date" required>
    </div>
    <div class="form-group">
        <label for="end_date">Date de fin:</label>
        <input type="date" id="end_date" name="end_date" required>
    </div>
    <div class="form-group">
        <label for="reason">Motif de la mission:</label>
        <textarea id="reason" name="reason" rows="3" required></textarea>
    </div>
    <div class="form-group">
        <label for="comment">Commentaire:</label>
        <textarea id="comment" name="comment" rows="3"></textarea>
    </div>
    <button type="submit" class="btn">Soumettre la demande</button>
    <a href="{% url 'my_requests' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
