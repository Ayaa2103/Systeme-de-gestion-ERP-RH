{% extends 'base.html' %}

{% block title %}Créer une Formation{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Créer une Nouvelle Formation</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
    <div class="form-group">
        <label for="name">Nom de la formation:</label>
        <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="4" required></textarea>
    </div>
    <div class="form-group">
        <label for="start_date">Date de début:</label>
        <input type="date" id="start_date" name="start_date" required>
    </div>
    <div class="form-group">
        <label for="end_date">Date de fin:</label>
        <input type="date" id="end_date" name="end_date" required>
    </div>
    
    <div class="form-group">
        <label>Employés participants (optionnel):</label>
        <div style="max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px;">
            {% for employee in employees %}
            <div>
                <input type="checkbox" id="emp_{{ employee.id }}" name="employees" value="{{ employee.id }}">
                <label for="emp_{{ employee.id }}">{{ employee.user.get_full_name }} ({{ employee.matricule }})</label>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <div style="background: #d1ecf1; padding: 15px; margin: 20px 0; border-radius: 5px;">
        <p><strong>Note:</strong> Cette formation sera soumise pour validation au HR Director.</p>
    </div>
    
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Créer la Formation</button>
                            <a href="{% url 'manage_training' %}" class="btn btn-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Validation des dates côté client
document.getElementById('start_date').addEventListener('change', function() {
    const startDate = new Date(this.value);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    if (startDate < today) {
        alert('La date de début ne peut pas être dans le passé');
        this.value = '';
    }
});

document.getElementById('end_date').addEventListener('change', function() {
    const startDate = new Date(document.getElementById('start_date').value);
    const endDate = new Date(this.value);
    
    if (endDate <= startDate) {
        alert('La date de fin doit être postérieure à la date de début');
        this.value = '';
    }
});
</script>
{% endblock %}
