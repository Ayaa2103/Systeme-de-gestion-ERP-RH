{% extends 'base.html' %}

{% block title %}Créer un Événement{% endblock %}

{% block content %}
<h1>Créer un Nouvel Événement</h1>

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="name">Nom de l'événement:</label>
        <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="4" required></textarea>
    </div>
    <div class="form-group">
        <label for="date">Date de l'événement:</label>
        <input type="date" id="date" name="date" required>
    </div>
    <div class="form-group">
        <label for="location">Lieu:</label>
        <input type="text" id="location" name="location" required>
    </div>
    
    <div style="background: #d1ecf1; padding: 15px; margin: 20px 0; border-radius: 5px;">
        <p><strong>Note:</strong> Cet événement sera soumis pour validation au HR Director.</p>
    </div>
    
    <button type="submit" class="btn">Créer l'Événement</button>
    <a href="{% url 'manage_events' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
