{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow">
                <div class="card-header">
                    <h5 class="m-0">{{ title }}</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="{{ form.title.id_for_label }}" class="form-label">Titre du Poste *</label>
                                {{ form.title }}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="{{ form.department.id_for_label }}" class="form-label">Département *</label>
                                {{ form.department }}
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="{{ form.experience_level.id_for_label }}" class="form-label">Niveau d'Expérience *</label>
                            {{ form.experience_level }}
                        </div>
                        
                        <div class="mb-3">
                            <label for="{{ form.description.id_for_label }}" class="form-label">Description du Poste *</label>
                            {{ form.description }}
                        </div>
                        
                        <div class="mb-3">
                            <label for="{{ form.required_skills.id_for_label }}" class="form-label">Compétences Requises *</label>
                            {{ form.required_skills }}
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'recruitment:job_offer_list' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Retour
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
