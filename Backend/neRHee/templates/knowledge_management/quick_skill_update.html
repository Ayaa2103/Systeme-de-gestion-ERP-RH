{% extends 'base.html' %}

{% block title %}Mise à jour Compétence{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Mise à jour Compétence</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label"><strong>Employé:</strong></label>
                            <p>{{ employee.user.get_full_name }} ({{ employee.poste }})</p>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><strong>Compétence:</strong></label>
                            <p>{{ skill.name }} - {{ skill.category }}</p>
                        </div>
                        
                        <div class="mb-3">
                            <label for="level" class="form-label">Niveau de maîtrise</label>
                            <select name="level" id="level" class="form-control" required>
                                <option value="0" {% if current_level == 0 %}selected{% endif %}>Non évalué</option>
                                <option value="1" {% if current_level == 1 %}selected{% endif %}>Débutant</option>
                                <option value="2" {% if current_level == 2 %}selected{% endif %}>Intermédiaire</option>
                                <option value="3" {% if current_level == 3 %}selected{% endif %}>Confirmé</option>
                                <option value="4" {% if current_level == 4 %}selected{% endif %}>Expert</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="certified" id="certified" class="form-check-input" {% if is_certified %}checked{% endif %}>
                                <label for="certified" class="form-check-label">Compétence certifiée</label>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'knowledge_management:skills_matrix' %}?department={{ employee.department.id }}" class="btn btn-secondary">Retour</a>
                            <button type="submit" class="btn btn-primary">Mettre à jour</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
