{% extends 'base.html' %}

{% block title %}Modifier Statut - {{ application.full_name }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card shadow">
                <div class="card-header">
                    <h5 class="m-0">Modifier le Statut de la Candidature</h5>
                    <small class="text-muted">{{ application.full_name }} - {{ application.job_offer.title }}</small>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="status" class="form-label">Nouveau Statut *</label>
                            <select name="status" id="status" class="form-control" required>
                                <option value="pending" {% if application.status == 'pending' %}selected{% endif %}>En attente</option>
                                <option value="reviewed" {% if application.status == 'reviewed' %}selected{% endif %}>Examiné</option>
                                <option value="interview" {% if application.status == 'interview' %}selected{% endif %}>Entretien</option>
                                <option value="accepted" {% if application.status == 'accepted' %}selected{% endif %}>Accepté</option>
                                <option value="rejected" {% if application.status == 'rejected' %}selected{% endif %}>Rejeté</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes RH</label>
                            <textarea name="notes" id="notes" class="form-control" rows="4" placeholder="Ajoutez vos commentaires...">{{ application.notes }}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'application_detail' application.pk %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Retour
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Mettre à Jour
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
